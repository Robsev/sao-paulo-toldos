name: Build do site (Astro)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descompactar código fonte
        run: |
          unzip -o sao-paulo-toldos.zip -d _src
          mv _src/sao-paulo-toldos site
          rm -rf _src

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: site
        run: npm install

      - name: Build do site
        working-directory: site
        run: npm run build

      - name: Publicar artefato (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 14

      - name: Deploy via rsync/SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: site/dist/
          remote_path: ${{ secrets.VPS_TARGET_DIR }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
