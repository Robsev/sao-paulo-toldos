name: Build do site (Astro)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descompactar código fonte
        run: |
          unzip -o sao-paulo-toldos.zip -d _src
          mv _src/sao-paulo-toldos site
          rm -rf _src

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: site
        run: npm install

      - name: Build do site
        working-directory: site
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
          PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}
          PUBLIC_SITE_LIVE: ${{ vars.PUBLIC_SITE_LIVE }}

      - name: Publicar artefato (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 14

      - name: Publicar dist na branch site-dist
        run: |
          cd site/dist
          git init -q
          git checkout -q -b site-dist
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "dist build ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin site-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
